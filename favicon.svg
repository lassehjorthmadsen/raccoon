<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Raccoon">
  <!-- A raccoon face at 16 px. Only three things survive that size: small round
       ears set wide, the dark bandit mask, and the two light eyes inside it —
       so everything else is left out. Tall pointed ears read as a cat, which is
       why these are stroked with a round join instead of drawn sharp. Colours
       are the site palette (styles.css): ink #2b2f38, board cream #f0e6d6,
       accent #c07a33. -->
  <rect width="64" height="64" rx="12" fill="#2b2f38"/>
  <g stroke-linejoin="round">
    <path d="M17 26 L22 16 L28 24 Z" fill="#f0e6d6" stroke="#f0e6d6" stroke-width="6"/>
    <path d="M47 26 L42 16 L36 24 Z" fill="#f0e6d6" stroke="#f0e6d6" stroke-width="6"/>
    <path d="M20 24 L23 19 L26 23 Z" fill="#c07a33" stroke="#c07a33" stroke-width="2.5"/>
    <path d="M44 24 L41 19 L38 23 Z" fill="#c07a33" stroke="#c07a33" stroke-width="2.5"/>
  </g>
  <path fill="#f0e6d6" d="M32 18c10 0 18 7.5 18 18 0 10-8 18-18 18s-18-8-18-18c0-10.5 8-18 18-18z"/>
  <!-- The mask: one band across the eyes, pinched at the bridge of the nose. -->
  <path fill="#2b2f38" d="M15 33c0-5.5 4.5-9 8.5-7.4l8.5 4.4 8.5-4.4c4-1.6 8.5 1.9 8.5 7.4 0 5.5-4.5 9-8.5 7.4L32 36l-8.5 4.4C19.5 42 15 38.5 15 33z"/>
  <circle cx="23.5" cy="33" r="3.2" fill="#f0e6d6"/>
  <circle cx="40.5" cy="33" r="3.2" fill="#f0e6d6"/>
  <path fill="#2b2f38" d="M32 43.8c2.4 0 3.7.7 3.7 1.8 0 1.6-1.7 3.3-3.7 3.3s-3.7-1.7-3.7-3.3c0-1.1 1.3-1.8 3.7-1.8z"/>
</svg>
