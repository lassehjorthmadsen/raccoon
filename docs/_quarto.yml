project:
  type: website
  output-dir: _site
  # Emitted into _site so the custom domain survives the gh-pages force-push
  # that `quarto publish` performs on every docs build.
  resources:
    - CNAME
  render:
    - "*.qmd"
    - "*.md"
    - "reference/*.qmd"
    - "!training_research.qmd"
    - "!plan.md"
    - "!matches/**"

website:
  title: "Raccoon"
  description: "A modern neural engine for backgammon"
  site-url: https://research.raccoonbg.com
  favicon: favicon.svg
  open-graph: true
  repo-url: https://github.com/lassehjorthmadsen/raccoon
  repo-actions: [issue]
  page-footer:
    left: "**{{< var company.name >}}** · CVR {{< var company.cvr >}} · Denmark"
    center: "[hello@raccoonbg.com](mailto:hello@raccoonbg.com)"
    right: "[GitHub](https://github.com/lassehjorthmadsen/raccoon) · [MIT licence](https://github.com/lassehjorthmadsen/raccoon/blob/main/LICENSE)"
  navbar:
    left:
      - text: "Home"
        file: index.qmd
      - text: "About"
        file: about.qmd
      - text: "Concepts"
        menu:
          - text: "MCTS Explained"
            file: mcts_explained.md
          - text: "Architecture"
            file: architecture.md
      - text: "Training"
        menu:
          - text: "Parameters"
            file: training_parameters.md
          - text: "Self-Play Analysis"
            file: training_analysis.qmd
          - text: "Supervised & Expert Iteration"
            file: pretraining_analysis.qmd
          - text: "Variance-Reduced Rollouts"
            file: variance_reduction.qmd
      - text: "Developer"
        file: gcp_guide.md
      - text: "Reference"
        file: reference/index.qmd
    right:
      - text: "Contact"
        file: contact.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-fold: true

execute:
  freeze: true

jupyter: python3

quartodoc:
  package: raccoon
  source_dir: ..
  dir: reference
  title: "API Reference"
  sections:
    - title: "Environment"
      desc: "OpenSpiel wrapper, board encoder, and action masking"
      contents:
        - env.game_wrapper
        - env.encoder
        - env.actions
    - title: "Model"
      desc: "ResNet policy-value network"
      contents:
        - model.network
    - title: "Search"
      desc: "MCTS with chance-node handling"
      contents:
        - search.mcts
    - title: "Training"
      desc: "Self-play loop, replay buffer, and coach"
      contents:
        - train.self_play
        - train.replay_buffer
        - train.coach
    - title: "Evaluation"
      desc: "Checkpoint arena, GNUBG benchmark, and variance-reduced rollouts"
      contents:
        - eval.arena
        - eval.doubles
        - eval.gnubg_harness
        - eval.luck
        - eval.vr_arena
    - title: "Protocol"
      desc: "Raccoon Game Protocol (RGP)"
      contents:
        - protocol.rgp
